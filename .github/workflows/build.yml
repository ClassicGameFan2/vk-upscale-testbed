name: Build Vulkan Testbed

on:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake
      # CRITICAL FIX: Use the Ninja generator (-G Ninja) to force Single-Config!
      run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      # Ninja doesn't need --config Release, it's already locked in!
      run: cmake --build build

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: vk-testbed-windows
        # CRITICAL FIX: Ninja drops the .exe directly into the build folder!
        path: build/vk-upscale-testbed.exe
