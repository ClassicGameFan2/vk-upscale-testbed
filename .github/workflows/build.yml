name: Build Vulkan Testbed

on:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake
      # CRITICAL FIX: Force the Build Type via the terminal to bypass AMD's crash!
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: vk-testbed-windows
        path: build/Release/vk-upscale-testbed.exe
